# Use the API image containing app.online_delivery_worker and online_delivery.
# Replace the placeholder with the exact deployed API image tag.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-delivery-worker
  namespace: market
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: {app: online-delivery-worker}
  template:
    metadata:
      labels: {app: online-delivery-worker}
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: worker
          image: market-api:REPLACE_WITH_DEPLOYED_TAG
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: [python, -m, app.online_delivery_worker]
          envFrom:
            - configMapRef: {name: market-config}
          env:
            - {name: PYTHONPATH, value: /app}
            - {name: MESSAGE_CENTER_DISABLE_BACKGROUND, value: 'true'}
            - {name: ONLINE_DELIVERY_WORKER_INTERVAL, value: '2'}
            - {name: ONLINE_DELIVERY_WORKER_BATCH, value: '10'}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: market-secrets, key: JWT_SECRET}}}
            - {name: APISIX_ADMIN_KEY, valueFrom: {secretKeyRef: {name: market-secrets, key: APISIX_ADMIN_KEY}}}
            - {name: MINIO_ACCESS_KEY, valueFrom: {secretKeyRef: {name: market-secrets, key: MINIO_ROOT_USER}}}
            - {name: MINIO_SECRET_KEY, valueFrom: {secretKeyRef: {name: market-secrets, key: MINIO_ROOT_PASSWORD}}}
            - {name: API_CREDENTIAL_ENCRYPTION_KEY, valueFrom: {secretKeyRef: {name: market-api-credentials, key: API_CREDENTIAL_ENCRYPTION_KEY}}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          startupProbe:
            exec:
              command: [python, -c, "import time; from pathlib import Path; assert 0 <= time.time()-Path('/tmp/online-delivery-heartbeat').stat().st_mtime < 90"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            exec:
              command: [python, -c, "import time; from pathlib import Path; assert 0 <= time.time()-Path('/tmp/online-delivery-heartbeat').stat().st_mtime < 90"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [python, -c, "import time; from pathlib import Path; assert 0 <= time.time()-Path('/tmp/online-delivery-heartbeat').stat().st_mtime < 180"]
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
