apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: market-mock-saas-data
  namespace: market
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-mock-saas
  namespace: market
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: market-mock-saas
  template:
    metadata:
      labels:
        app: market-mock-saas
    spec:
      containers:
        - name: mock-saas
          image: market-mock-saas:REPLACE_WITH_DEPLOYED_TAG
          imagePullPolicy: Never
          ports:
            - containerPort: 8200
          env:
            - name: MOCK_SAAS_DB_PATH
              value: /data/mock-saas.sqlite3
            - name: MOCK_SAAS_PUBLIC_BASE_URL
              value: http://192.168.10.10:30083
            - name: OIDC_ISSUER
              value: http://192.168.10.10:30080
            - name: OIDC_BACKCHANNEL_BASE_URL
              value: http://market-api:8000
            - name: OIDC_ALLOW_HTTP_DEVELOPMENT
              value: "true"
            - name: PLATFORM_OAUTH_INTROSPECTION_URL
              value: http://market-api:8000/oauth/introspect
            - name: MOCK_SAAS_ENABLE_TEST_ADMIN
              value: "true"
            - name: MOCK_SAAS_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: market-mock-saas-admin
                  key: secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8200
            initialDelaySeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: state
              mountPath: /data
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: market-mock-saas-data
---
apiVersion: v1
kind: Service
metadata:
  name: market-mock-saas-browser
  namespace: market
spec:
  type: NodePort
  selector:
    app: market-mock-saas
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30083
