apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-maintenance-data
  namespace: market
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-maintenance-worker
  namespace: market
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: redis-maintenance-worker}
  template:
    metadata:
      labels: {app: redis-maintenance-worker}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: maintenance
          image: market-redis-maintenance:REPLACE_WITH_DEPLOYED_TAG
          imagePullPolicy: IfNotPresent
          command: [python, -m, app.redis_maintenance_worker]
          envFrom:
            - configMapRef: {name: market-config}
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: market-db-connection, key: DATABASE_URL}}}
            - {name: MESSAGE_CENTER_DISABLE_BACKGROUND, value: 'true'}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: market-secrets, key: JWT_SECRET}}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          volumeMounts:
            - {name: evidence, mountPath: /var/lib/market-maintenance}
            - {name: temporary, mountPath: /tmp}
          readinessProbe:
            exec:
              command: [python, -c, "import time; from pathlib import Path; assert 0 <= time.time()-Path('/tmp/redis-maintenance-alive').stat().st_mtime < 90"]
            periodSeconds: 10
          # A long maintenance transaction must not be killed by a heartbeat liveness probe.
      volumes:
        - name: evidence
          persistentVolumeClaim: {claimName: redis-maintenance-data}
        - name: temporary
          emptyDir: {}
