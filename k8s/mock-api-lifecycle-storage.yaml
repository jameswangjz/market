apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: market-mock-api-data
  namespace: market
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-mock-api
  namespace: market
spec:
  strategy:
    type: Recreate
  template:
    spec:
      containers:
        - name: mock-api
          env:
            - name: MOCK_API_DB_PATH
              value: /data/mock-api.sqlite3
          volumeMounts:
            - name: provider-state
              mountPath: /data
      volumes:
        - name: provider-state
          persistentVolumeClaim:
            claimName: market-mock-api-data
