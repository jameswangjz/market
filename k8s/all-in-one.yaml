apiVersion: v1
kind: Namespace
metadata:
  name: market
---
apiVersion: v1
kind: Secret
metadata:
  name: market-secrets
  namespace: market
type: Opaque
stringData:
  POSTGRES_PASSWORD: market-dev-password
  JWT_SECRET: market-k8s-development-secret-change-me
  MINIO_ROOT_USER: market
  MINIO_ROOT_PASSWORD: market123456
  APISIX_ADMIN_KEY: market-apisix-admin-dev-change-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-config
  namespace: market
data:
  DATABASE_URL: postgresql+psycopg://market:market-dev-password@market-postgres:5432/market
  MINIO_ENDPOINT: market-minio:9000
  MINIO_BUCKET: market-files
  REDIS_URL: redis://market-redis:6379/0
  CORS_ORIGINS: '*'
  PUBLIC_BASE_URL: http://192.168.10.10:30080
  APISIX_ENABLED: 'true'
  APISIX_ADMIN_URL: http://market-apisix-admin:9180/apisix/admin
  APISIX_COMPAT_UPSTREAM: http://market-gateway:8100
  APISIX_NATIVE_AUTH: 'true'
  APISIX_NATIVE_UPSTREAM: 'true'
  UPSTREAM_ALLOWED_HOSTS: 'market-mock-api,market-mock-saas'
  UPSTREAM_ALLOWED_CIDRS: ''
  PRESIDIO_ANALYZER_URL: http://market-presidio-analyzer:3000/analyze
  CLAMAV_HOST: market-clamav
  CLAMAV_PORT: '3310'
  CLAMAV_ENABLED: 'true'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: market-clamav-data
  namespace: market
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-clamav
  namespace: market
  labels: {app: market-clamav}
spec:
  replicas: 1
  selector:
    matchLabels: {app: market-clamav}
  template:
    metadata:
      labels: {app: market-clamav}
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:1.4
          ports:
            - containerPort: 3310
          volumeMounts:
            - name: clamav-data
              mountPath: /var/lib/clamav
          readinessProbe:
            tcpSocket: {port: 3310}
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            tcpSocket: {port: 3310}
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: clamav-data
          persistentVolumeClaim: {claimName: market-clamav-data}
---
apiVersion: v1
kind: Service
metadata:
  name: market-clamav
  namespace: market
spec:
  selector: {app: market-clamav}
  ports:
    - name: clamd
      port: 3310
      targetPort: 3310
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: market-clamav-freshclam
  namespace: market
spec:
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: freshclam
              image: clamav/clamav:1.4
              command: ["freshclam", "--foreground"]
              volumeMounts:
                - name: clamav-data
                  mountPath: /var/lib/clamav
          volumes:
            - name: clamav-data
              persistentVolumeClaim: {claimName: market-clamav-data}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: market-postgres-data
  namespace: market
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-postgres
  namespace: market
  labels: {app: market-postgres}
spec:
  replicas: 1
  selector: {matchLabels: {app: market-postgres}}
  template:
    metadata: {labels: {app: market-postgres}}
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5432}]
          env:
            - {name: POSTGRES_DB, value: market}
            - {name: POSTGRES_USER, value: market}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: market-secrets, key: POSTGRES_PASSWORD}}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          readinessProbe: {exec: {command: ["sh", "-c", "pg_isready -U market -d market"]}, initialDelaySeconds: 8, periodSeconds: 5}
          livenessProbe: {exec: {command: ["sh", "-c", "pg_isready -U market -d market"]}, initialDelaySeconds: 20, periodSeconds: 10}
      volumes: [{name: data, persistentVolumeClaim: {claimName: market-postgres-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: market-postgres, namespace: market}
spec:
  selector: {app: market-postgres}
  ports: [{name: postgres, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-redis
  namespace: market
  labels: {app: market-redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: market-redis}}
  template:
    metadata: {labels: {app: market-redis}}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 6379}]
          readinessProbe: {exec: {command: ["redis-cli", "ping"]}, initialDelaySeconds: 5, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: market-redis, namespace: market}
spec:
  selector: {app: market-redis}
  ports: [{name: redis, port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-presidio-analyzer
  namespace: market
  labels: {app: market-presidio-analyzer}
spec:
  replicas: 1
  selector: {matchLabels: {app: market-presidio-analyzer}}
  template:
    metadata: {labels: {app: market-presidio-analyzer}}
    spec:
      containers:
        - name: analyzer
          image: ghcr.io/data-privacy-stack/presidio-analyzer:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 3000}]
          readinessProbe: {httpGet: {path: /health, port: 3000}, initialDelaySeconds: 30, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: 3000}, initialDelaySeconds: 60, periodSeconds: 20}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
---
apiVersion: v1
kind: Service
metadata: {name: market-presidio-analyzer, namespace: market}
spec:
  selector: {app: market-presidio-analyzer}
  ports: [{name: http, port: 3000, targetPort: 3000}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: market-minio-data
  namespace: market
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-minio
  namespace: market
  labels: {app: market-minio}
spec:
  replicas: 1
  selector: {matchLabels: {app: market-minio}}
  template:
    metadata: {labels: {app: market-minio}}
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-12-18T13-15-44Z
          imagePullPolicy: IfNotPresent
          args: ["server", "/data", "--console-address", ":9001"]
          ports: [{name: api, containerPort: 9000}, {name: console, containerPort: 9001}]
          env:
            - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: market-secrets, key: MINIO_ROOT_USER}}}
            - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: market-secrets, key: MINIO_ROOT_PASSWORD}}}
          volumeMounts: [{name: data, mountPath: /data}]
          readinessProbe: {httpGet: {path: /minio/health/ready, port: 9000}, initialDelaySeconds: 8, periodSeconds: 5}
      volumes: [{name: data, persistentVolumeClaim: {claimName: market-minio-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: market-minio, namespace: market}
spec:
  selector: {app: market-minio}
  ports: [{name: api, port: 9000, targetPort: 9000}, {name: console, port: 9001, targetPort: 9001}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-api
  namespace: market
  labels: {app: market-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: market-api}}
  template:
    metadata: {labels: {app: market-api}}
    spec:
      containers:
        - name: api
          image: market-api:dev
          imagePullPolicy: Never
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: market-config}}]
          env:
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: market-secrets, key: JWT_SECRET}}}
            - {name: APISIX_ADMIN_KEY, valueFrom: {secretKeyRef: {name: market-secrets, key: APISIX_ADMIN_KEY}}}
            - {name: MINIO_ACCESS_KEY, valueFrom: {secretKeyRef: {name: market-secrets, key: MINIO_ROOT_USER}}}
            - {name: MINIO_SECRET_KEY, valueFrom: {secretKeyRef: {name: market-secrets, key: MINIO_ROOT_PASSWORD}}}
          startupProbe: {httpGet: {path: /api/health, port: 8000}, periodSeconds: 5, timeoutSeconds: 2, failureThreshold: 36}
          readinessProbe: {httpGet: {path: /api/health, port: 8000}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /api/health, port: 8000}, initialDelaySeconds: 20, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: market-api, namespace: market}
spec:
  selector: {app: market-api}
  ports: [{name: http, port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-gateway
  namespace: market
  labels: {app: market-gateway}
spec:
  replicas: 1
  selector: {matchLabels: {app: market-gateway}}
  template:
    metadata: {labels: {app: market-gateway}}
    spec:
      containers:
        - name: gateway
          image: market-gateway:dev
          imagePullPolicy: Never
          ports: [{containerPort: 8100}]
          envFrom: [{configMapRef: {name: market-config}}]
          readinessProbe: {httpGet: {path: /health, port: 8100}, initialDelaySeconds: 8, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8100}, initialDelaySeconds: 15, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: market-gateway, namespace: market}
spec:
  type: NodePort
  selector: {app: market-gateway}
  ports: [{name: http, port: 8100, targetPort: 8100, nodePort: 30081}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-web
  namespace: market
  labels: {app: market-web}
spec:
  replicas: 1
  selector: {matchLabels: {app: market-web}}
  template:
    metadata: {labels: {app: market-web}}
    spec:
      containers:
        - name: web
          image: market-web:dev
          imagePullPolicy: Never
          ports: [{containerPort: 80}]
          readinessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 5, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: market-web, namespace: market}
spec:
  type: NodePort
  selector: {app: market-web}
  ports: [{name: http, port: 80, targetPort: 80, nodePort: 30080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-mock-saas
  namespace: market
  labels: {app: market-mock-saas}
spec:
  replicas: 1
  selector: {matchLabels: {app: market-mock-saas}}
  template:
    metadata: {labels: {app: market-mock-saas}}
    spec:
      containers:
        - name: mock-saas
          image: market-mock-saas:dev
          imagePullPolicy: Never
          ports: [{containerPort: 8200}]
          env:
            - {name: PLATFORM_OAUTH_INTROSPECTION_URL, value: "http://market-api:8000/oauth/introspect"}
          readinessProbe: {httpGet: {path: /health, port: 8200}, initialDelaySeconds: 5, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: market-mock-saas, namespace: market}
spec:
  selector: {app: market-mock-saas}
  ports: [{name: http, port: 8200, targetPort: 8200}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-mock-api
  namespace: market
  labels: {app: market-mock-api}
spec:
  replicas: 1
  selector: {matchLabels: {app: market-mock-api}}
  template:
    metadata: {labels: {app: market-mock-api}}
    spec:
      containers:
        - name: mock-api
          image: market-mock-api:dev
          imagePullPolicy: Never
          ports: [{containerPort: 8300}]
          env:
            - {name: PLATFORM_OAUTH_INTROSPECTION_URL, value: "http://market-api:8000/oauth/introspect"}
          readinessProbe: {httpGet: {path: /health, port: 8300}, initialDelaySeconds: 5, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: market-mock-api, namespace: market}
spec:
  selector: {app: market-mock-api}
  ports: [{name: http, port: 8300, targetPort: 8300}]
