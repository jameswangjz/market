apiVersion: v1
kind: ConfigMap
metadata:
  name: market-prometheus-config
  namespace: market
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ["market-alertmanager:9093"]
    rule_files: ["/etc/prometheus/rules/*.yml"]
    scrape_configs:
      - job_name: apisix
        metrics_path: /apisix/prometheus/metrics
        static_configs:
          - targets: ["market-apisix-metrics:9091"]
      - job_name: market-api
        metrics_path: /metrics
        static_configs:
          - targets: ["market-api:8000"]
      - job_name: market-notifications
        metrics_path: /metrics/notifications
        static_configs:
          - targets: ["market-api:8000"]
  gateway-alerts.yml: |
    groups:
      - name: market-gateway
        rules:
          - alert: MarketApisixEtcdUnreachable
            expr: apisix_etcd_reachable == 0
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: APISIX 无法连接 etcd
              description: APISIX 配置中心连接异常超过 2 分钟。
          - alert: MarketApisixNoRequests
            expr: up{job="apisix"} == 0
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: APISIX 指标端点不可用
              description: APISIX 监控端点连续 2 分钟不可采集。
          - alert: MarketApiUnavailable
            expr: up{job="market-api"} == 0
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: 运营平台控制面不可用
              description: market-api 健康检查连续 2 分钟不可采集。
          - alert: MarketNotificationDeliveryFailed
            expr: sum(market_notification_jobs{status="failed"}) > 0
            for: 1m
            labels: {severity: warning}
            annotations:
              summary: 消息发送存在失败任务
              description: 请在消息中心检查失败任务并恢复发送。
          - alert: MarketNotificationBacklog
            expr: market_notification_oldest_pending_seconds > 300
            for: 2m
            labels: {severity: warning}
            annotations:
              summary: 消息发送任务积压
              description: 最早待发送任务已等待超过五分钟，请检查Worker与SMTP/Redis。
          - alert: MarketNotificationMetricsUnavailable
            expr: up{job="market-notifications"} == 0
            for: 2m
            labels: {severity: critical}
            annotations:
              summary: 消息中心监控不可采集
              description: 消息中心指标端点不可用。
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-alertmanager-config
  namespace: market
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: market-log
      group_by: [alertname, severity]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 4h
    receivers:
      - name: market-log
        webhook_configs: []
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-prometheus
  namespace: market
  labels: {app: market-prometheus}
spec:
  replicas: 1
  selector: {matchLabels: {app: market-prometheus}}
  template:
    metadata: {labels: {app: market-prometheus}}
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
          ports: [{name: http, containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml}
            - {name: rules, mountPath: /etc/prometheus/rules}
            - {name: data, mountPath: /prometheus}
          readinessProbe: {httpGet: {path: /-/ready, port: 9090}, initialDelaySeconds: 10, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /-/healthy, port: 9090}, initialDelaySeconds: 20, periodSeconds: 10}
      volumes:
        - {name: config, configMap: {name: market-prometheus-config, items: [{key: prometheus.yml, path: prometheus.yml}]}}
        - {name: rules, configMap: {name: market-prometheus-config, items: [{key: gateway-alerts.yml, path: gateway-alerts.yml}]}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: market-prometheus
  namespace: market
spec:
  selector: {app: market-prometheus}
  ports: [{name: http, port: 9090, targetPort: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-alertmanager
  namespace: market
  labels: {app: market-alertmanager}
spec:
  replicas: 1
  selector: {matchLabels: {app: market-alertmanager}}
  template:
    metadata: {labels: {app: market-alertmanager}}
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
          ports: [{name: http, containerPort: 9093}]
          volumeMounts:
            - {name: config, mountPath: /etc/alertmanager/alertmanager.yml, subPath: alertmanager.yml}
            - {name: data, mountPath: /alertmanager}
          readinessProbe: {httpGet: {path: /-/ready, port: 9093}, initialDelaySeconds: 10, periodSeconds: 5}
      volumes:
        - {name: config, configMap: {name: market-alertmanager-config}}
        - {name: data, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: market-alertmanager
  namespace: market
spec:
  selector: {app: market-alertmanager}
  ports: [{name: http, port: 9093, targetPort: 9093}]
