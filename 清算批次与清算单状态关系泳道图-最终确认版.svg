<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1280" viewBox="0 0 1900 1280">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#526274"/></marker>
    <marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c24141"/></marker>
    <style>
      .t{font:700 28px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.s{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#667085}.l{font:700 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#26364a}.d{font:400 12px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#718096}.h{font:700 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172033}.x{font:400 12px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475467}.n{font:400 11px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#667085}
    </style>
  </defs>
  <rect width="1900" height="1180" fill="#f7f9fc"/>
  <text x="50" y="52" class="t">清算批次与清算单状态关系跨泳道图（最终确认版）</text>
  <text x="50" y="80" class="s">重算规则：清算批次只要尚未进入“已确认”及之后的状态，均可作废原批次并重新生成；已确认后禁止直接重算。</text>

  <rect x="30" y="110" width="1840" height="125" rx="8" fill="#eef5ff" stroke="#d7e5f6"/>
  <rect x="30" y="235" width="1840" height="235" rx="8" fill="#f5f7fb" stroke="#e0e6ef"/>
  <rect x="30" y="470" width="1840" height="220" rx="8" fill="#f1fbf6" stroke="#d6eee1"/>
  <rect x="30" y="690" width="1840" height="165" rx="8" fill="#fffaf0" stroke="#f1e5c8"/>
  <rect x="30" y="855" width="1840" height="225" rx="8" fill="#fff5f5" stroke="#f0dada"/>

  <text x="55" y="153" class="l">业务订单</text><text x="55" y="177" class="d">payment_status=paid</text>
  <text x="55" y="280" class="l">清算批次</text><text x="55" y="304" class="d">组织周期清算和付款</text>
  <text x="55" y="515" class="l">清算单</text><text x="55" y="539" class="d">单笔订单金额、成本、利润及分账</text>
  <text x="55" y="735" class="l">清算明细</text><text x="55" y="759" class="d">平台、提供方、服务方、专家、渠道</text>
  <text x="55" y="900" class="l">系统与审计</text><text x="55" y="924" class="d">生成、检索、调整、锁定、确认、付款、重算</text>

  <rect x="300" y="140" width="210" height="68" rx="8" fill="#fff" stroke="#75aaf4" stroke-width="2"/><text x="405" y="168" text-anchor="middle" class="h">订单已支付</text><text x="405" y="190" text-anchor="middle" class="x">业务订单保持 paid</text>
  <rect x="1540" y="140" width="260" height="68" rx="8" fill="#fff" stroke="#75aaf4" stroke-width="2"/><text x="1670" y="168" text-anchor="middle" class="h">清算不改变订单支付状态</text><text x="1670" y="190" text-anchor="middle" class="x">退款另行走冲正流程</text>

  <rect x="520" y="270" width="210" height="78" rx="8" fill="#fff" stroke="#8d9caf" stroke-width="2"/><text x="625" y="298" text-anchor="middle" class="h">生成批次</text><text x="625" y="321" text-anchor="middle" class="x">generated</text><text x="625" y="338" text-anchor="middle" class="n">自动生成清算单</text>
  <rect x="790" y="270" width="210" height="78" rx="8" fill="#fff7e8" stroke="#e0a33d" stroke-width="2"/><text x="895" y="298" text-anchor="middle" class="h">待确认</text><text x="895" y="321" text-anchor="middle" class="x">pending_confirm</text><text x="895" y="338" text-anchor="middle" class="n">全部清算单已锁定</text>
  <rect x="1060" y="270" width="210" height="78" rx="8" fill="#edf4ff" stroke="#2563eb" stroke-width="2"/><text x="1165" y="298" text-anchor="middle" class="h">已确认</text><text x="1165" y="321" text-anchor="middle" class="x">confirmed</text><text x="1165" y="338" text-anchor="middle" class="n">禁止直接重算</text>
  <rect x="1330" y="270" width="210" height="78" rx="8" fill="#e7f8ef" stroke="#16a05d" stroke-width="2"/><text x="1435" y="298" text-anchor="middle" class="h">已付款</text><text x="1435" y="321" text-anchor="middle" class="x">paid</text><text x="1435" y="338" text-anchor="middle" class="n">所有清算单付款完成</text>
  <rect x="1580" y="270" width="250" height="78" rx="8" fill="#fff0f0" stroke="#c24141" stroke-width="2"/><text x="1705" y="298" text-anchor="middle" class="h">作废重算</text><text x="1705" y="321" text-anchor="middle" class="x">superseded</text><text x="1705" y="338" text-anchor="middle" class="n">仅限确认前状态</text>
  <rect x="500" y="365" width="780" height="70" rx="10" fill="none" stroke="#c24141" stroke-width="2" stroke-dasharray="8 6"/><text x="520" y="390" class="h" fill="#c24141">可重算区间：generated / pending_confirm / disputed / exception / recon_exception</text><text x="520" y="414" class="x">作废原批次、关联清算单和清算明细，再生成新批次</text>

  <rect x="520" y="495" width="210" height="78" rx="8" fill="#fff" stroke="#57b98a" stroke-width="2"/><text x="625" y="523" text-anchor="middle" class="h">自动生成清算单</text><text x="625" y="546" text-anchor="middle" class="x">pending</text><text x="625" y="563" text-anchor="middle" class="n">支持查询和未锁定调整</text>
  <rect x="790" y="495" width="210" height="78" rx="8" fill="#effbf5" stroke="#57b98a" stroke-width="2"/><text x="895" y="523" text-anchor="middle" class="h">清算结果锁定</text><text x="895" y="546" text-anchor="middle" class="x">locked</text><text x="895" y="563" text-anchor="middle" class="n">锁定后不能直接调整</text>
  <rect x="1060" y="495" width="210" height="78" rx="8" fill="#e7f8ef" stroke="#16a05d" stroke-width="2"/><text x="1165" y="523" text-anchor="middle" class="h">清算单已付款</text><text x="1165" y="546" text-anchor="middle" class="x">paid</text><text x="1165" y="563" text-anchor="middle" class="n">批次付款同步更新</text>
  <rect x="1330" y="495" width="210" height="78" rx="8" fill="#fff0f0" stroke="#c24141" stroke-width="2"/><text x="1435" y="523" text-anchor="middle" class="h">清算单作废</text><text x="1435" y="546" text-anchor="middle" class="x">superseded</text><text x="1435" y="563" text-anchor="middle" class="n">保留历史和审计</text>

  <rect x="520" y="715" width="210" height="70" rx="8" fill="#fff" stroke="#e0ad55" stroke-width="2"/><text x="625" y="743" text-anchor="middle" class="h">明细 pending</text><text x="625" y="766" text-anchor="middle" class="x">五方金额等待锁定</text>
  <rect x="790" y="715" width="210" height="70" rx="8" fill="#fff9e9" stroke="#e0ad55" stroke-width="2"/><text x="895" y="743" text-anchor="middle" class="h">明细 locked</text><text x="895" y="766" text-anchor="middle" class="x">等待批次确认和付款</text>
  <rect x="1060" y="715" width="210" height="70" rx="8" fill="#e7f8ef" stroke="#16a05d" stroke-width="2"/><text x="1165" y="743" text-anchor="middle" class="h">明细 paid</text><text x="1165" y="766" text-anchor="middle" class="x">写入 payment_no</text>

  <rect x="270" y="895" width="240" height="78" rx="8" fill="#fff" stroke="#d77b7b" stroke-width="2"/><text x="390" y="923" text-anchor="middle" class="h">清算单检索</text><text x="390" y="946" text-anchor="middle" class="x">批次/清算单/订单号/状态</text><text x="390" y="963" text-anchor="middle" class="n">列表显示关联批次</text>
  <rect x="550" y="895" width="240" height="78" rx="8" fill="#fff" stroke="#d77b7b" stroke-width="2"/><text x="670" y="923" text-anchor="middle" class="h">详情与调整</text><text x="670" y="946" text-anchor="middle" class="x">金额、成本、利润、五方比例</text><text x="670" y="963" text-anchor="middle" class="n">仅未锁定清算单</text>
  <rect x="830" y="895" width="240" height="78" rx="8" fill="#fff" stroke="#d77b7b" stroke-width="2"/><text x="950" y="923" text-anchor="middle" class="h">逐笔锁定</text><text x="950" y="946" text-anchor="middle" class="x">全部锁定后批次 pending_confirm</text><text x="950" y="963" text-anchor="middle" class="n">记录操作人员和前后状态</text>
  <rect x="1110" y="895" width="240" height="78" rx="8" fill="#fff" stroke="#d77b7b" stroke-width="2"/><text x="1230" y="923" text-anchor="middle" class="h">超级管理员确认</text><text x="1230" y="946" text-anchor="middle" class="x">批次 confirmed，清算单 locked</text><text x="1230" y="963" text-anchor="middle" class="n">确认后禁止重算</text>
  <rect x="1390" y="895" width="240" height="78" rx="8" fill="#fff" stroke="#d77b7b" stroke-width="2"/><text x="1510" y="923" text-anchor="middle" class="h">批次付款</text><text x="1510" y="946" text-anchor="middle" class="x">清算单和明细同步 paid</text><text x="1510" y="963" text-anchor="middle" class="n">记录付款流水</text>
  <rect x="1670" y="895" width="230" height="78" rx="8" fill="#fff" stroke="#d77b7b" stroke-width="2"/><text x="1785" y="923" text-anchor="middle" class="h">全流程审计</text><text x="1785" y="946" text-anchor="middle" class="x">生成/调整/锁定/确认/付款</text><text x="1785" y="963" text-anchor="middle" class="n">before/after 状态和数值</text>

  <path d="M510 174 H1540" stroke="#526274" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M510 934 H520" stroke="#526274" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M510 934 C520 800 520 315 520 315" stroke="#526274" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M730 309 H790" stroke="#526274" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1000 309 H1060" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#b)"/><path d="M1270 309 H1330" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
  <path d="M730 534 H790" stroke="#526274" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1000 534 H1060" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#b)"/><path d="M730 750 H790" stroke="#526274" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M1000 750 H1060" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
  <path d="M625 348 V495" stroke="#526274" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="642" y="425" class="n">自动生成</text><path d="M895 573 V715" stroke="#526274" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M950 895 C950 850 895 850 895 785" stroke="#d77b7b" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M950 895 C950 850 895 850 895 573" stroke="#d77b7b" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M895 495 V348" stroke="#e0a33d" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="912" y="425" class="n">全部清算单 locked</text>
  <path d="M1230 895 C1230 850 1165 850 1165 573" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#b)"/><path d="M1510 895 C1510 850 1165 850 1165 785" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#b)"/><path d="M1510 895 C1510 850 1435 850 1435 348" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
  <path d="M1705 348 V375" stroke="#c24141" stroke-width="2" stroke-dasharray="8 6" fill="none" marker-end="url(#r)"/><path d="M1785 895 C1680 820 1435 820 1435 573" stroke="#c24141" stroke-width="2" stroke-dasharray="8 6" fill="none" marker-end="url(#r)"/>
  <rect x="270" y="1015" width="1630" height="65" rx="9" fill="#fff" stroke="#cfd8e5"/><text x="295" y="1042" class="s">关键边界：业务订单 paid 与清算付款独立；批次 confirmed 及之后禁止直接重算；未确认状态作废后，新批次重新生成。</text><text x="295" y="1065" class="s">清算单详情展示批次、订单、金额、五方比例和金额、生命周期及审计 before/after 信息。</text>
  <text x="270" y="1130" class="h">清算批次状态机（明确状态变化）</text>
  <rect x="270" y="1150" width="220" height="60" rx="8" fill="#fff" stroke="#8d9caf" stroke-width="2"/><text x="380" y="1175" text-anchor="middle" class="h">generated</text><text x="380" y="1195" text-anchor="middle" class="n">生成批次</text>
  <rect x="610" y="1150" width="220" height="60" rx="8" fill="#fff7e8" stroke="#e0a33d" stroke-width="2"/><text x="720" y="1175" text-anchor="middle" class="h">pending_confirm</text><text x="720" y="1195" text-anchor="middle" class="n">全部清算单锁定</text>
  <rect x="950" y="1150" width="220" height="60" rx="8" fill="#edf4ff" stroke="#2563eb" stroke-width="2"/><text x="1060" y="1175" text-anchor="middle" class="h">confirmed</text><text x="1060" y="1195" text-anchor="middle" class="n">超级管理员确认</text>
  <rect x="1290" y="1150" width="220" height="60" rx="8" fill="#e7f8ef" stroke="#16a05d" stroke-width="2"/><text x="1400" y="1175" text-anchor="middle" class="h">paid</text><text x="1400" y="1195" text-anchor="middle" class="n">所有清算单付款成功</text>
  <rect x="610" y="1225" width="220" height="40" rx="8" fill="#fff0f0" stroke="#c24141" stroke-width="2"/><text x="720" y="1250" text-anchor="middle" class="h">superseded / 作废</text>
  <path d="M490 1180 H610" stroke="#526274" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M830 1180 H950" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#b)"/><path d="M1170 1180 H1290" stroke="#2563eb" stroke-width="2.5" fill="none" marker-end="url(#b)"/>
  <path d="M720 1210 V1225" stroke="#c24141" stroke-width="2" stroke-dasharray="8 6" fill="none" marker-end="url(#r)"/><text x="745" y="1222" class="n">确认前允许重算</text>
</svg>
